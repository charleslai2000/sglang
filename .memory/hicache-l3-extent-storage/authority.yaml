# terminal acceptance and no implementation is authorized.
# Decisions RULED by the user 2026-09-12 (binding, final; not revisited for "stricter fsync").
decided_by: user
decided_on: 2026-09-12
decisions:
  D1_allowed_recovered_prefix:
    blocking: true
    status: DECIDED
    chosen: "(b) process-crash semantics"
    frozen_meaning: >
      For SIGKILL/process crash: every operation that completed a WAL-durable commit AND was ACKed
      to the upper layer MUST be recoverable after restart. For power loss/kernel crash: extent
      DATA BYTES are explicitly NOT promised on stable media (a separate, stronger tier this design
      does not claim).
    hard_invariant: >
      The extent data write must complete to kernel/page-cache BEFORE the WAL GROUP_COMMIT becomes
      durable AND BEFORE the upper-layer ACK. `WAL durable -> ACK -> data write not yet complete` is
      FORBIDDEN. G1 crash oracle tests ONLY SIGKILL/process restart; never packaged as power-loss
      durability.
  D2_power_loss_data_durability:
    blocking: false
    status: DECIDED
    chosen: "(a) WAL fdatasync only"
  D3_fail_closed_vs_salvage:
    blocking: true
    status: DECIDED
    chosen: "(a) fail closed"
    frozen_meaning: >
      Committed manifest/WAL corruption -> refuse to start that cache namespace (fail closed). The
      designed torn ACTIVE tail/frame repair is retained. Committed-region corruption is NOT
      auto-truncated/salvaged and served; no silent cold-start pretending durability. Rationale:
      wrong resurrection of KV+Mamba state is far worse than a cache miss.
  D4_sidecar_ack_semantics:
    blocking: false
    status: DECIDED
    chosen: "(b) sidecar ACK deferred to GROUP_COMMIT"
    note: must hold because KV+Mamba are one hybrid restore unit
  D5_open_design_choice:
    blocking: false
    status: DECIDED
    chosen: "dispositioned in the contract §15 text alongside the ruling; no mechanism change"
  D6_metadata_io_accounting:
    blocking: false
    status: DECIDED
    chosen: "(a) separate metadata counters"
  D7_durable_group_id_identity:
    blocking: true
    status: DECIDED
    chosen: "(a) 128-bit random namespace_epoch + per-run group_seq"
    frozen_meaning: >
      group_id = (namespace_epoch[16B], group_seq); epoch from a CSPRNG per writer/runtime
      incarnation; group_seq monotonic within the epoch; epoch persisted in WAL/group metadata so
      old/new runs never collide; KV and Mamba sidecar use the IDENTICAL group_id; (0,0) is ONLY the
      explicit ungrouped sentinel; all-zero epoch FORBIDDEN for any normal grouped operation.
  novel_declaration:
    blocking: false
    status: DECIDED
    chosen: "NM-EXTENT-RESTART-REBUILD-01 ACCEPTED"
    acceptance_decision_id: USER-RULING-20260912-G1
    scope: >
      the frozen mechanism only: compact manifest/checkpoint + append-only WAL -> restart rebuild
      RAM-authoritative index. No open-ended mechanism expansion.

